name: CI/CD MiBici

on:
  push:
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Pruebas unitarias (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10 con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias del sistema (libgomp1 para LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas (pytest)
        run: pytest -v

  docker-build-and-validate:
    name: Construcción de imágenes y validación de Compose
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar sintaxis de Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml --profile loadtest config -q

      - name: Construir imágenes del proyecto (mlflow, prep, api-p1, api-p2, api-p3)
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          docker compose -f docker/docker-compose.yml build

      - name: Validar levantamiento de MLflow con Compose
        run: |
          docker compose -f docker/docker-compose.yml up -d mlflow
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5001 > /dev/null; then
              echo "MLflow respondió correctamente en http://localhost:5001"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker/docker-compose.yml logs mlflow
          exit 1

      - name: Limpiar contenedores de prueba
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v
